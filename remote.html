
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2329486273161479"
     crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071326">
  <title>EBCONTROL - Universal Remote</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #17345b, #050b16 65%);
      color: white;
      padding: 25px 12px;
    }

    header {
      max-width: 850px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5px 25px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: #08baff;
    }

    header a {
      color: #a9c7eb;
      text-decoration: none;
      font-size: 13px;
    }

    .heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .heading h1 span {
      color: #08baff;
    }

    .heading p {
      color: #9bb0ce;
      font-size: 13px;
    }

    .remote {
      width: 100%;
      max-width: 330px;
      margin: auto;
      padding: 18px 17px 25px;
      border-radius: 35px;
      background: linear-gradient(110deg, #080b12, #252831 48%, #080a10);
      border: 2px solid #414651;
      box-shadow: 0 25px 60px #000b, inset 0 0 15px #ffffff0a;
    }

    button {
      cursor: pointer;
      color: white;
      border: 1px solid #05070b;
      background: linear-gradient(145deg, #343943, #11151c);
      box-shadow: 0 3px 3px #0009, inset 0 1px 1px #ffffff17;
      border-radius: 8px;
      font-weight: bold;
      transition: .15s;
    }

    button:active {
      transform: scale(.94);
      background: #087cff;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .power {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(#fa5260, #a90025);
      border: 3px solid #60101d;
      font-size: 30px;
    }

    .source {
      width: 75px;
      height: 53px;
      font-size: 12px;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 17px;
    }

    .numbers button {
      height: 48px;
      font-size: 24px;
    }

    .small-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      margin-bottom: 15px;
    }

    .small-row button {
      height: 48px;
      font-size: 11px;
    }

    .middle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 17px;
    }

    .volume, .channel {
      height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      font-size: 25px;
    }

    .volume button, .channel button {
      width: 100%;
      height: 58px;
      font-size: 23px;
    }

    .mute-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mute-list button {
      height: 65px;
      font-size: 11px;
    }

    .mute-list button:nth-child(2) {
      height: 75px;
    }

    .channel {
      font-size: 23px;
    }

    .home-guide {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .home-guide button {
      height: 58px;
      font-size: 13px;
    }

    .netflix {
      background: linear-gradient(#fff, #ddd);
      color: #d40018;
    }

    .menu-info {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      margin-bottom: 10px;
    }

    .menu-info button {
      height: 54px;
      font-size: 12px;
    }

    .direction {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .direction button {
      height: 54px;
      font-size: 23px;
    }

    .direction .back {
      font-size: 17px;
    }

    .return-exit {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }

    .return-exit button {
      height: 53px;
      font-size: 12px;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-bottom: 15px;
    }

    .colors button {
      height: 42px;
      font-size: 16px;
    }

    .red { background: #c92736; }
    .green { background: #078e6a; }
    .yellow { background: #d69a15; }
    .blue { background: #174fc4; }

    .extra {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .extra button {
      height: 40px;
      font-size: 10px;
    }

    .media {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .media button {
      height: 42px;
      font-size: 18px;
    }

    .model {
      text-align: center;
      color: #777f8e;
      font-size: 10px;
      margin-top: 17px;
    }

    .brand-name {
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-top: 20px;
      color: #d5d8df;
    }

    .message {
      max-width: 330px;
      margin: 18px auto;
      padding: 13px;
      background: #102440;
      border: 1px solid #29466b;
      border-radius: 12px;
      text-align: center;
      color: #b8d0ed;
      font-size: 12px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #8296b5;
      font-size: 11px;
      padding: 20px;
    }

    @media(max-width:360px) {
      .remote {
        padding: 14px 11px 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">EB<span>CONTROL</span></div>
  <a href="index.html">← Home</a>
</header>

<div class="heading">
  <h1>Universal <span>TV Remote</span></h1>
  <p>All your TV controls in one place.</p>
</div>

<div class="remote">

  <div class="top-row">
    <button class="power" onclick="cmd('Power')">⏻</button>
    <button class="source" onclick="cmd('Source')">▣<br>SOURCE</button>
  </div>

  <div class="numbers">
    <button onclick="cmd('1')">1</button>
    <button onclick="cmd('2')">2</button>
    <button onclick="cmd('3')">3</button>
    <button onclick="cmd('4')">4</button>
    <button onclick="cmd('5')">5</button>
    <button onclick="cmd('6')">6</button>
    <button onclick="cmd('7')">7</button>
    <button onclick="cmd('8')">8</button>
    <button onclick="cmd('9')">9</button>
  </div>

  <div class="small-row">
    <button onclick="cmd('TTX / MIX')">TTX/MIX</button>
    <button onclick="cmd('0')">0</button>
    <button onclick="cmd('Previous channel')">PRE-CH</button>
  </div>

  <div class="middle">
    <div class="volume">
      <button onclick="cmd('Volume up')">＋</button>
      <span>◢</span>
      <button onclick="cmd('Volume down')">−</button>
    </div>

    <div class="mute-list">
      <button onclick="cmd('Mute')">MUTE<br>🔇</button>
      <button onclick="cmd('Channel list')">▤<br>CH LIST</button>
    </div>

    <div class="channel">
      <button onclick="cmd('Channel up')">⌃<br>P</button>
      <button onclick="cmd('Channel down')">⌄</button>
    </div>
  </div>

  <div class="home-guide">
    <button class="netflix" onclick="cmd('Netflix')">NETFLIX</button>
    <button onclick="cmd('Home')">⌂ HOME</button>
    <button onclick="cmd('Guide')">GUIDE</button>
    <button onclick="cmd('Smart Hub')">SMART HUB</button>
  </div>

  <div class="menu-info">
    <button onclick="cmd('Menu')">☷<br>MENU</button>
    <button onclick="cmd('Voice')">🎙<br>VOICE</button>
    <button onclick="cmd('Info')">ⓘ<br>INFO</button>
  </div>

  <div class="direction">
    <button onclick="cmd('Up')">▲</button>
    <button onclick="cmd('OK')">OK</button>
    <button onclick="cmd('Back')">↶</button>
    <button onclick="cmd('Left')">◀</button>
    <button onclick="cmd('Select')">↵</button>
    <button onclick="cmd('Right')">▶</button>
    <button onclick="cmd('Return')">RETURN</button>
    <button onclick="cmd('Down')">▼</button>
    <button onclick="cmd('Exit')">EXIT</button>
  </div>

  <div class="colors">
    <button class="red" onclick="cmd('A')">A</button>
    <button class="green" onclick="cmd('B')">B</button>
    <button class="yellow" onclick="cmd('C')">C</button>
    <button class="blue" onclick="cmd('D')">D</button>
  </div>

  <div class="extra">
    <button onclick="cmd('Sleep')">SLEEP</button>
    <button onclick="cmd('Alarm')">ALARM</button>
    <button onclick="cmd('Aspect')">ASPECT</button>
    <button onclick="cmd('Stop')">■</button>
  </div>

  <div class="media">
    <button onclick="cmd('Rewind')">◀◀</button>
    <button onclick="cmd('Play')">▶</button>
    <button onclick="cmd('Pause')">Ⅱ</button>
    <button onclick="cmd('Fast forward')">▶▶</button>
  </div>

  <div class="model">EBCONTROL UNIVERSAL REMOTE</div>
  <div class="brand-name">EB CONTROL</div>

</div>

<div class="message" id="message" aria-live="polite">
  Demo mode: Select any button to try the remote.
</div>

<footer>
  © 2026 EBCONTROL — Smart Control. Better Entertainment.
</footer>

<script>
  function cmd(name) {
    document.getElementById("message").textContent =
      name + " selected. Demo mode: no command has been sent to a TV yet.";
  }
</script>

</body>
</html>
